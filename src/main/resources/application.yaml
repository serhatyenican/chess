spring:
  application:
    name: chess
  # Local dev: load DB settings from the git-ignored .env file (shared with docker-compose).
  # In CI and production, the same names come from real environment variables.
  config:
    import: optional:file:.env[.properties]
  # ADR 0002: Spring MVC on virtual threads
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chess}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema (ADR 0005); Hibernate only checks that entities match it.
      ddl-auto: validate
    show-sql: true