spring:
  application:
    name: chess
  # Local dev: load DB settings from the git-ignored .env file (shared with docker-compose).
  # In CI and production, the same names come from real environment variables.
  config:
    import: optional:file:.env[.properties]
  # ADR 0002: Spring MVC on virtual threads
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chess}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema (ADR 0005); Hibernate only checks that entities match it.
      ddl-auto: validate
    show-sql: true
    # Off: no database session for the whole HTTP request. The service maps entities to responses inside its
    # transaction, so a lazy load in the web layer fails loudly instead of quietly running queries.
    open-in-view: false
  jackson:
    deserialization:
      # Spring Boot ignores unknown JSON fields by default. We reject them (400), so a typo or a field the API
      # doesn't support, such as {"status": "LEFT", "winner": "WHITE"}, isn't silently dropped.
      fail-on-unknown-properties: true
  mvc:
    # Errors as RFC 9457 problem details, e.g. a malformed id (ADR 0010).
    problemdetails:
      enabled: true

# Actuator: expose only health over HTTP. Other endpoints (env, beans, ...) can leak internals.
management:
  endpoints:
    web:
      exposure:
        include: health