name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The path filter reads a pull request's changed files through the GitHub API.
  pull-requests: read

jobs:
  # Decides whether the build is needed. "Build and test" is a required check on main, so the workflow must always
  # start: with paths-ignore on the trigger, a docs-only PR would wait forever for the check. A job skipped by its
  # `if`, however, counts as passed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Needed for pushes, where the filter compares commits. For pull requests it uses the API.
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # A file counts as code only if it matches all patterns: anything except Markdown files and docs/.
          # So the workflow files count as code too.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  build:
    # The required check has this name: keep it.
    name: Build and test
    needs: changes
    # Pushes to main always build, as a safety net.
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # Tests use Testcontainers: Docker is preinstalled on GitHub's Ubuntu runners.
      - name: Build and run tests
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
