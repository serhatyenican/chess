# Dependabot opens a PR when a dependency has a newer version.
# CI runs on each PR: green means the update is probably safe to merge.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # One PR per week for all minor and patch updates; a major version still gets a PR of its own.
    groups:
      frontend:
        update-types:
          - "minor"
          - "patch"
    # Node itself (frontend/.nvmrc) isn't updated by Dependabot: moving to a new Node version is done by hand, e.g.
    # when the next LTS arrives. @types/node's major version follows Node's, so raise it together with .nvmrc then.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # The generator of src/api/schema.ts (#97): its own package, since openapi-typescript needs TypeScript 5.
  # CI doesn't run it. Before merging an update here, run `npm run api:types` in frontend/ with Spring running, and
  # check that src/api/schema.ts is unchanged (or the change is expected). An openapi-typescript release that supports
  # TypeScript 7 means the folder can go (see CLAUDE.md).
  - package-ecosystem: "npm"
    directory: "/frontend/tools/api-types"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      api-types-tool:
        update-types:
          - "minor"
          - "patch"
    # openapi-typescript needs TypeScript 5 as its peer, so a newer major version would break the generator.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
